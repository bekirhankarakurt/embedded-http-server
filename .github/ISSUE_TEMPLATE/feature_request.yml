name: Feature request
description: Suggest an improvement or a new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why is it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: API sketch, configuration option or behaviour you would like.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Embedded constraints
      description: Memory, CPU, toolchain or certification constraints that apply.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
