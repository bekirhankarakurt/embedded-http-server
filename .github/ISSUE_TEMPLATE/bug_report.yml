name: Bug report
description: Report incorrect behaviour, a crash or a protocol violation
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Commands, a raw HTTP request (e.g. a `--replay` file) or a minimal program.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: Ubuntu 24.04 x86_64, GCC 13 / Yocto aarch64, GCC 12
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Server output, sanitizer reports or test output.
      render: text
